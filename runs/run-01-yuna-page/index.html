<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f7f4f1" />
<title>연아 · My Name is Yuna (하네스 산출물 · 자리표시자)</title>
<!-- ⚠️ 하네스 산출물: 실제 yuna.page 디자인 시스템을 그대로 가져오되,
     연아 실제 사진·소개·장래희망은 공개 저장소라 전부 자리표시자로 둠. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f7f4f1; --white:#fff; --ink:#1d1b20; --ink-2:#4a4650; --ink-3:#6f6a74;
    --line:#e4dde6; --field:#fff; --tint:#fbf3f7;
    --blush:#e9b8c6; --mist:#b5d3e6;
    --grad:linear-gradient(90deg,#e2a3b8,#9cc6e2);
    --grad-v:linear-gradient(180deg,#e2a3b8,#9cc6e2);
    --grad-focus:linear-gradient(120deg,#cf7a96,#6fa3c9);
    --error:#b3261e; --focus:#4d84b8; --radius:14px;
    --ease:cubic-bezier(.2,.8,.2,1); color-scheme:light;
    --f-body:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    --f-hand:"Nanum Pen Script",var(--f-body);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(120deg,#f4dce5 0%,#ece3ee 50%,#d9e9f3 100%) fixed;
    color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
  .page{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);
    padding:0 0 calc(120px + env(safe-area-inset-bottom))}
  @media(min-width:560px){.page{box-shadow:0 0 60px rgba(120,100,150,.12)}}

  /* 히어로: 사진(자리표시자) + 크레용 낙서 + 손글씨 */
  .hero{position:relative;aspect-ratio:3/4;overflow:hidden;background:linear-gradient(160deg,var(--blush),var(--mist))}
  .hero-photo{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.9);
    font-size:14px;letter-spacing:.02em;background:linear-gradient(160deg,var(--blush),var(--mist))}
  .doodles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .hero-type{position:absolute;left:5%;top:3%;margin:0;transform:rotate(-7deg);
    font-family:var(--f-hand);font-size:46px;line-height:.98;color:var(--ink)}
  .hero-type small{display:block;font-size:26px;opacity:.8}

  .block{padding:40px 24px 0}
  .block + .block{margin-top:8px}
  .label{margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .label-row{display:flex;justify-content:space-between;align-items:baseline}
  .label-meta{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .name{display:inline-block;margin:0 0 22px;font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-.04em}
  .name-en{margin-left:4px;font-size:22px;font-weight:500;letter-spacing:.02em;color:var(--ink-3);vertical-align:4px}
  .name::after{content:"";display:block;width:100%;height:3px;margin-top:12px;border-radius:2px;background:var(--grad)}
  .body-text{margin:0;font-size:17px;line-height:1.75;color:var(--ink-2)}
  .ph{color:var(--ink-3);font-style:normal}
  .dream-text{position:relative;margin:0;padding-left:16px;font-size:clamp(18px,5.6vw,22px);line-height:1.45;font-weight:600;letter-spacing:-.03em}
  .dream-text::before{content:"";position:absolute;left:0;top:.15em;bottom:.15em;width:2px;border-radius:1px;background:var(--grad-v)}

  /* 갤러리: 9장 + 더보기 (실제 사진 대신 자리표시자 타일) */
  .gallery{padding-left:0;padding-right:0}
  .gallery .label-row{padding:0 24px}
  .gallery-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .photo{display:block;width:100%;aspect-ratio:1;border:0;background:var(--tint)}
  .ph-tile{background:linear-gradient(135deg,var(--blush),var(--mist))}
  .gallery-grid li:nth-child(3n+2) .ph-tile{background:linear-gradient(135deg,#f3d9c6,#cdb8e4)}
  .gallery-grid li:nth-child(3n) .ph-tile{background:linear-gradient(135deg,#c9e2cf,#b5d3e6)}
  .more-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;margin-top:4px;
    border:0;background:none;cursor:pointer;font:inherit;font-size:15px;font-weight:600;color:var(--ink-2)}
  .more-btn::after{content:"";width:7px;height:7px;margin-top:-3px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg);transition:transform .2s}
  .more-btn[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:3px}

  /* 토글 BGM (자동재생 아님 · 오디오는 자리표시자) */
  .bgm-btn{position:fixed;z-index:11;top:calc(12px + env(safe-area-inset-top));right:max(12px,calc(50% - 260px + 12px));
    display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;
    background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    box-shadow:0 2px 10px rgba(29,27,32,.12);color:var(--ink);cursor:pointer}
  .bgm-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .bgm-btn .ic-on{display:none}
  .bgm-btn[aria-pressed="true"] .ic-on{display:block}
  .bgm-btn[aria-pressed="true"] .ic-off{display:none}

  /* 하단 고정 CTA */
  .cta-bar{position:fixed;left:50%;bottom:0;z-index:10;width:100%;max-width:520px;transform:translateX(-50%);
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 55%,rgba(247,244,241,0))}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:0 20px;border:0;border-radius:14px;
    background:var(--ink);color:#fff;font:inherit;font-size:16px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:transform .12s var(--ease)}
  .btn:active{transform:scale(.985)}
  .btn-send{color:#f4c6d4}
  .btn-ghost{background:var(--tint);color:var(--ink)}
  .cta-bar .btn{max-width:480px;margin:0 auto}
  .icon-btn{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--ink);cursor:pointer}
  .icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* 바텀시트 폼 (간소화: 3필드) */
  .sheet{width:100%;max-width:520px;max-height:92dvh;margin:auto auto 0;padding:10px 24px calc(20px + env(safe-area-inset-bottom));
    border:0;border-radius:24px 24px 0 0;background:var(--white);color:var(--ink);box-shadow:0 -12px 40px rgba(29,27,32,.1);overflow-y:auto}
  .sheet::backdrop{background:rgba(29,27,32,.28)}
  .sheet-grip{width:40px;height:4px;margin:0 auto 10px;border-radius:2px;background:var(--grad)}
  .sheet-head{position:relative;display:flex;align-items:center;justify-content:space-between;margin:0 -10px 4px 0}
  .sheet-title{display:flex;align-items:center;gap:2px}
  .sheet-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.03em}
  .info-chip{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--ink-3);cursor:pointer}
  .info-chip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
  .info-chip .dot{fill:currentColor;stroke:none}
  .info-pop{position:absolute;z-index:5;top:calc(100% + 4px);left:0;right:10px;padding:16px 18px;border-radius:14px;background:var(--ink);color:#fff;box-shadow:0 12px 32px rgba(29,27,32,.25)}
  .info-pop dl{margin:0;display:grid;gap:12px}
  .info-pop dt{font-size:13px;font-weight:700;color:#fff}
  .info-pop dd{margin:2px 0 0;font-size:14px;line-height:1.55;color:rgba(255,255,255,.82)}
  .sheet-lead{margin:0 0 22px;font-size:15px;line-height:1.6;color:var(--ink-2)}
  .field{margin:0 0 20px}
  .field > label,.field-label-row label{display:block;margin-bottom:8px;font-size:15px;font-weight:600;color:var(--ink)}
  .field-label-row{display:flex;justify-content:space-between;align-items:baseline}
  .counter{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  input[type=text],input[type=tel],textarea{width:100%;min-height:52px;padding:14px 16px;font:inherit;font-size:16px;color:var(--ink);
    background:var(--field);border:1.5px solid var(--line);border-radius:12px;-webkit-appearance:none;appearance:none;transition:border-color .15s}
  textarea{resize:none;min-height:132px;line-height:1.6}
  input:focus,textarea:focus{outline:none;border-color:transparent;
    background:linear-gradient(#fff,#fff) padding-box,var(--grad-focus) border-box;
    box-shadow:-3px 0 10px rgba(226,163,184,.25),3px 0 10px rgba(156,198,226,.3)}
  ::placeholder{color:#8a8590}
  .hint{margin:8px 0 0;font-size:14px;color:var(--ink-3)}
  .error{margin:8px 0 0;font-size:14px;font-weight:600;color:var(--error)}
  .error:empty{display:none}
  .field.invalid input,.field.invalid textarea{border-color:var(--error)}
  .sheet-done{padding:28px 0 4px;text-align:center}
  .sheet-done h3{margin:0 0 6px;font-size:20px;letter-spacing:-.03em}
  .sheet-done p{margin:0 0 28px;color:var(--ink-2);font-size:15px}
  button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
  [hidden]{display:none!important}
</style>
</head>
<body class="card-page">
<main class="page">
  <header class="hero">
    <div class="hero-photo">(연아 사진 자리표시자)</div>
    <!-- 크레용 낙서 (실제 yuna.page에서 가져옴 · 개인정보 아님) -->
    <svg class="doodles" viewBox="0 0 300 400" aria-hidden="true">
      <defs><filter id="crayon" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter></defs>
      <g filter="url(#crayon)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(222 128) rotate(14)" stroke="#f3c445" stroke-width="2.6">
          <path d="M-17 9 L-20 -9 L-9 0 L0 -13 L9 0 L20 -9 L17 9 Q0 13 -17 9"/></g>
        <g transform="translate(38 168)" stroke="#7cbfe8" stroke-width="2.4">
          <path d="M0 -12 Q1.5 -1.5 12 0 Q1.5 1.5 0 12 Q-1.5 1.5 -12 0 Q-1.5 -1.5 0 -12 Z"/></g>
        <g transform="translate(262 196) rotate(-10)" stroke="#f3c445" stroke-width="2.6">
          <path d="M15 -2 A15 15 0 1 1 11 -10"/><path d="M-5 -6 v4 M5 -6 v4"/><path d="M-8 4 Q0 12 8 4"/></g>
        <g transform="translate(246 372) rotate(-12)" stroke="#ef8fb3" stroke-width="2.4">
          <path d="M0 6 C-12 -2 -8 -12 0 -5 C8 -12 12 -2 0 6 Z"/></g>
      </g>
    </svg>
    <p class="hero-type"><small>My Name is</small>YUNA</p>
  </header>

  <section class="block intro">
    <p class="label">About</p>
    <h1 class="name">연아<span class="name-en">(YUNA)</span></h1>
    <p class="body-text ph">(연아가 직접 고른 소개 문구가 들어가요)</p>
  </section>

  <section class="block dream">
    <p class="label">Dream</p>
    <p class="dream-text ph">(연아가 말한 장래희망이 들어가요)</p>
  </section>

  <section class="block gallery" aria-labelledby="gt">
    <div class="label-row"><h2 class="label" id="gt">Gallery</h2><span class="label-meta" id="count">9</span></div>
    <ul class="gallery-grid" id="grid">
      <li><div class="photo ph-tile"></div></li>
      <li><div class="photo ph-tile"></div></li>
      <li><div class="photo ph-tile"></div></li>
      <li><div class="photo ph-tile"></div></li>
      <li><div class="photo ph-tile"></div></li>
      <li><div class="photo ph-tile"></div></li>
      <li><div class="photo ph-tile"></div></li>
      <li><div class="photo ph-tile"></div></li>
      <li><div class="photo ph-tile"></div></li>
      <li class="more" hidden><div class="photo ph-tile"></div></li>
      <li class="more" hidden><div class="photo ph-tile"></div></li>
      <li class="more" hidden><div class="photo ph-tile"></div></li>
    </ul>
    <button type="button" class="more-btn" id="moreBtn" aria-expanded="false" aria-controls="grid">사진 3장 더보기</button>
  </section>
</main>

<!-- 토글 BGM (자동재생 아님; 오디오 파일은 자리표시자) -->
<button type="button" class="bgm-btn" id="bgmBtn" aria-label="배경음악 켜기" aria-pressed="false">
  <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
</button>

<div class="cta-bar"><button type="button" class="btn btn-send" id="openSheet">연아에게 메시지 보내기</button></div>

<!-- 메시지 바텀시트 (간소화: 친구 이름 · 전할 메시지 · 연락처) -->
<dialog class="sheet" id="sheet" aria-labelledby="st">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <div class="sheet-title">
      <h2 id="st">To. 연아</h2>
      <button type="button" class="info-chip" id="infoToggle" aria-label="메시지 안내 보기" aria-expanded="false" aria-controls="infoPop">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9"/><path d="M10 5.5v5.5"/><circle class="dot" cx="10" cy="14.2" r="1.1"/></svg>
      </button>
    </div>
    <button type="button" class="icon-btn" id="closeSheet" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="info-pop" id="infoPop" role="dialog" aria-label="메시지 안내" hidden>
      <dl>
        <div><dt>전달 방법</dt><dd>문자로 연아 아빠 휴대폰에 바로 전달돼요.</dd></div>
        <div><dt>보는 사람</dt><dd>연아 아빠만 볼 수 있어요.</dd></div>
        <div><dt>답장</dt><dd>답장할 때 연아 아빠 번호가 보여요.</dd></div>
      </dl>
    </div>
  </div>
  <form id="form" novalidate>
    <p class="sheet-lead">연아 아빠가 먼저 읽고, 적어주신 번호로 답장드려요.</p>
    <div class="field" id="f-name">
      <label for="friendName">친구 이름</label>
      <input id="friendName" type="text" maxlength="30" autocomplete="off" placeholder="연아 친구의 이름" required />
      <p class="error" id="e-name"></p>
    </div>
    <div class="field" id="f-msg">
      <div class="field-label-row"><label for="message">전할 메시지</label><span class="counter" id="cnt">0 / 1,000</span></div>
      <textarea id="message" maxlength="1000" placeholder="연아에게 하고 싶은 말" required></textarea>
      <p class="error" id="e-msg"></p>
    </div>
    <div class="field" id="f-phone">
      <label for="phone">답변받을 연락처</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="010-0000-0000" required />
      <p class="hint">휴대폰 번호만 받아요. 보호자와 함께 적어주세요.</p>
      <p class="error" id="e-phone"></p>
    </div>
    <button type="submit" class="btn btn-send">연아에게 메시지 보내기</button>
  </form>
  <div class="sheet-done" id="done" hidden>
    <h3>메시지를 전했어요</h3>
    <p>남겨주신 번호로 연락드릴게요.</p>
    <button type="button" class="btn btn-ghost" id="doneClose">닫기</button>
  </div>
</dialog>

<script>
  var $=function(id){return document.getElementById(id)};
  // 갤러리 더보기
  $('moreBtn').addEventListener('click',function(){
    var ex=this.getAttribute('aria-expanded')==='true';
    document.querySelectorAll('#grid .more').forEach(function(li){li.hidden=ex});
    this.setAttribute('aria-expanded',String(!ex));
    this.firstChild && (this.childNodes[0].nodeValue = ex?'사진 3장 더보기':'접기');
    $('count').textContent = ex?'9':'12';
  });
  // BGM 토글 (데모: 상태만)
  $('bgmBtn').addEventListener('click',function(){
    var on=this.getAttribute('aria-pressed')==='true';
    this.setAttribute('aria-pressed',String(!on));
    this.setAttribute('aria-label',on?'배경음악 켜기':'배경음악 끄기');
  });
  // 바텀시트 열고 닫기
  var sheet=$('sheet');
  $('openSheet').addEventListener('click',function(){
    ['name','msg','phone'].forEach(clr);
    $('form').hidden=false; $('done').hidden=true;
    sheet.showModal();
  });
  $('closeSheet').addEventListener('click',function(){ sheet.close(); });
  // 안내 팝
  $('infoToggle').addEventListener('click',function(){
    var ex=this.getAttribute('aria-expanded')==='true';
    this.setAttribute('aria-expanded',String(!ex)); $('infoPop').hidden=ex;
  });
  // 글자수
  $('message').addEventListener('input',function(){ $('cnt').textContent=this.value.length.toLocaleString()+' / 1,000'; });
  // 검증(데모) + 완료
  function bad(id,msg){ $('f-'+id).classList.add('invalid'); $('e-'+id).textContent=msg; }
  function clr(id){ $('f-'+id).classList.remove('invalid'); $('e-'+id).textContent=''; }
  $('form').addEventListener('submit',function(e){
    e.preventDefault(); var ok=true, first=null;
    var n=$('friendName').value.trim(), m=$('message').value.trim(), p=$('phone').value.trim();
    clr('name');clr('msg');clr('phone');
    if(!n){bad('name','친구 이름을 적어주세요.');ok=false;first=first||'friendName';}
    if(!m){bad('msg','전할 메시지를 적어주세요.');ok=false;first=first||'message';}
    if(!/\d{9,}/.test(p.replace(/\D/g,''))){bad('phone','휴대폰 번호를 확인해주세요.');ok=false;first=first||'phone';}
    if(!ok){ $(first).focus(); return; }
    $('form').hidden=true; $('done').hidden=false;
  });
  $('doneClose').addEventListener('click',function(){ sheet.close(); });
</script>
</body>
</html>
